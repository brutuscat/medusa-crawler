name: Bundler version watch

on:
  pull_request:
  schedule:
    - cron: '17 6 1 */2 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'

      - id: bundler
        name: Check Bundler pin
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'json'
          require 'net/http'
          require 'rubygems/version'

          workflow_paths = %w[
            .github/workflows/ruby.yml
            .github/workflows/publish-gem.yml
            .github/workflows/dependency-edge.yml
          ]

          pins = workflow_paths.flat_map do |path|
            File.read(path).scan(/^\s*bundler:\s*['"]?([^'"\s]+)['"]?\s*$/).flatten
          end.uniq

          abort "Expected one Bundler pin across workflows, found: #{pins.inspect}" unless pins.one?

          current = Gem::Version.new(pins.first)
          uri = URI('https://rubygems.org/api/v1/versions/bundler.json')
          response = Net::HTTP.get_response(uri)
          abort "RubyGems API returned #{response.code}" unless response.is_a?(Net::HTTPSuccess)

          stable = JSON.parse(response.body)
            .reject { |release| release['prerelease'] }
            .map { |release| Gem::Version.new(release.fetch('number')) }
            .uniq
            .sort
            .reverse

          latest = stable.fetch(0)
          target = stable.fetch(1, latest)
          needs_bump = current < target

          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |out|
            out.puts "current=#{current}"
            out.puts "latest=#{latest}"
            out.puts "target=#{target}"
            out.puts "needs_bump=#{needs_bump}"
          end

          puts "Current pin: #{current}"
          puts "Latest stable: #{latest}"
          puts "Recommended target: #{target}"
          RUBY

      - name: Open or update Bundler maintenance issue
        if: steps.bundler.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Maintenance: Bundler pin update'
          issue="$(gh issue list --state open --json number,title --jq '.[] | select(.title == "Maintenance: Bundler pin update") | .number' | head -n 1)"

          cat > /tmp/bundler-issue.md <<EOF
          Medusa is intentionally kept one stable Bundler release behind the newest release.

          - Current pin: `${{ steps.bundler.outputs.current }}`
          - Latest stable: `${{ steps.bundler.outputs.latest }}`
          - Recommended target: `${{ steps.bundler.outputs.target }}`

          Please review the Bundler release notes, update all workflow pins together, and let the normal CI matrix validate the bump.

          Generated by `bundler-version-watch.yml`.
          EOF

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file /tmp/bundler-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/bundler-issue.md
          fi

      - name: Close stale Bundler maintenance issue
        if: steps.bundler.outputs.needs_bump != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --state open --json number,title --jq '.[] | select(.title == "Maintenance: Bundler pin update") | .number' | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment 'Bundler pin is back within the one-release-behind policy.'
          fi
