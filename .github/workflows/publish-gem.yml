name: Publish gem

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  private-login-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    services:
      the_internet:
        image: gprestes/the-internet@sha256:205b8fc712747ea5fa1a0d54b01fa02d65e3f67a448c7a5c2aba65b211def171
        ports:
          - 5000

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Crawl authenticated test page
        env:
          MEDUSA_LIVE_SMOKE: '1'
          MEDUSA_SMOKE_BASE_URL: http://127.0.0.1:${{ job.services.the_internet.ports['5000'] }}
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 "$MEDUSA_SMOKE_BASE_URL/login" > /dev/null
          bundle exec rspec spec/examples/private_site_with_login_spec.rb --tag smoke

  publish:
    needs: private-login-smoke
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Verify tag matches gem version
        run: |
          ruby <<'RUBY'
          spec = Gem::Specification.load('medusa.gemspec')
          abort 'Unable to load medusa.gemspec' unless spec

          tag_version = ENV.fetch('GITHUB_REF_NAME').delete_prefix('v')
          gem_version = spec.version.to_s

          abort "Tag #{tag_version} does not match gem version #{gem_version}" unless tag_version == gem_version
          RUBY

      - uses: rubygems/release-gem@v1
