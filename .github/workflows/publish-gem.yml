name: Publish gem

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  private-login-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Crawl authenticated test page
        run: bundle exec ruby spec/smoke/private_site_with_login_smoke.rb

  publish:
    needs: private-login-smoke
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Verify tag matches gem version
        run: |
          ruby <<'RUBY'
          spec = Gem::Specification.load('medusa.gemspec')
          abort 'Unable to load medusa.gemspec' unless spec

          tag_version = ENV.fetch('GITHUB_REF_NAME').delete_prefix('v')
          gem_version = spec.version.to_s

          abort "Tag #{tag_version} does not match gem version #{gem_version}" unless tag_version == gem_version
          RUBY

      - uses: rubygems/release-gem@v1
