name: Publish gem

on:
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  BUNDLE_WITHOUT: debugging_tools
  BUNDLE_LOCKFILE: /tmp/medusa-release.lock

jobs:
  ci:
    uses: ./.github/workflows/ruby.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ruby
          bundler: '4.0.20'

      - name: Install release dependencies
        run: bundle install

      - name: Verify tag matches gem version
        run: |
          ruby <<'RUBY'
          spec = Gem::Specification.load('medusa.gemspec')
          abort 'Unable to load medusa.gemspec' unless spec

          tag_version = ENV.fetch('GITHUB_REF_NAME').delete_prefix('v')
          gem_version = spec.version.to_s

          abort "Tag #{tag_version} does not match gem version #{gem_version}" unless tag_version == gem_version
          RUBY

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
