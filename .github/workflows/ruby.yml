name: Ruby

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  BUNDLE_WITHOUT: debugging_tools
  BUNDLE_LOCKFILE: /tmp/medusa-ci.lock

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '4.0.20'

      - name: Install dependencies
        run: bundle install

      - name: Test with RSpec
        run: bundle exec rspec spec

  minimum-dependencies:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/minimum.gemfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup minimum supported Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler: '4.0.20'

      - name: Install minimum runtime dependencies
        run: bundle install

      - name: Test minimum runtime dependencies
        run: bundle exec rspec spec

  private-login-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      the_internet:
        image: gprestes/the-internet@sha256:205b8fc712747ea5fa1a0d54b01fa02d65e3f67a448c7a5c2aba65b211def171
        ports:
          - 5000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: select-ruby
        name: Select Ruby version
        shell: bash
        run: |
          versions=(3.3 3.4 4.0)
          echo "version=${versions[RANDOM % ${#versions[@]}]}" >> "$GITHUB_OUTPUT"

      - name: Setup Ruby ${{ steps.select-ruby.outputs.version }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ steps.select-ruby.outputs.version }}
          bundler: '4.0.20'

      - name: Install dependencies
        run: bundle install

      - name: Crawl authenticated test page
        env:
          MEDUSA_LIVE_SMOKE: '1'
          MEDUSA_SMOKE_BASE_URL: http://127.0.0.1:${{ job.services.the_internet.ports['5000'] }}
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 "$MEDUSA_SMOKE_BASE_URL/login" > /dev/null
          bundle exec rspec spec/examples --tag smoke
